<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugHunter — Просмотр БД</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Система учёта дефектов «BugHunter» — Содержимое БД</h1>

        <?php foreach ($tablesData as $tableName => $rows): ?>
            <section class="table-section">
                <h2>Таблица: <?= htmlspecialchars($tableName) ?></h2>

                <?php if (count($rows) > 0): ?>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <?php foreach (array_keys($rows[0]) as $columnName): ?>
                                        <th><?= htmlspecialchars($columnName) ?></th>
                                    <?php endforeach; ?>
                                </tr>
                            </thead>
                            <tbody>
                                <?php foreach ($rows as $row): ?>
                                    <tr>
                                        <?php foreach ($row as $value): ?>
                                            <td><?= htmlspecialchars((string)$value) ?></td>
                                        <?php endforeach; ?>
                                    </tr>
                                <?php endforeach; ?>
                            </tbody>
                        </table>
                    </div>
                <?php else: ?>
                    <p class="empty-msg">В таблице пока нет записей.</p>
                <?php endif; ?>
            </section>
        <?php endforeach; ?>
    </div>

</body>
</html>
